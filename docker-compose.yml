# Cursor (AI-assisted).

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - STORAGE_MODE=local
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./backend/app:/app/app  # hot-reload in development
    restart: unless-stopped
